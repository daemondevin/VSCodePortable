[Launch]
ProgramExecutable=VSCode\Code.exe
CommandLineArguments='--user-data-dir="%PAL:DataDir%\code" --extensions-dir="%PAL:DataDir%\code\extensions"'
DirectoryMoveOK=yes
SingleAppInstance=true
SinglePortableAppInstance=false
RefreshShellIcons=both
DisableSplashScreen=true
SplashTime=0
SupportsUNC=yes
MinOS=10

[Activate]
Fonts=true
FileAssociations=true

; Open with entries for these types. Windows keeps its own default for each
; one (IfExists=skip), so an extension that already has a handler only gains
; an "Open with" entry. Set IfExists=replace to make VS Code the default
; while it runs; the previous default comes back when it closes.
[FileAssociation1]
Extension=.txt,.ini,.xml,.js,.css
ProgID=VSCodePortable.SourceFile
Description=Source File
DefaultIcon=%PAL:AppDir%\VSCode\Code.exe,0
OpenCommand="%PAL:LauncherPath%" "%1"
IfExists=skip

[ContextMenu1]
Target=*
MenuKey=VSCodePortable
MenuText=Open with Code (Portable)
MenuCommand="%PAL:LauncherPath%" "%1"
MenuIcon=%PAL:AppDir%\VSCode\Code.exe,0

[ContextMenu2]
Target=Directory
MenuKey=VSCodePortable
MenuText=Open with Code (Portable)
MenuCommand="%PAL:LauncherPath%" "%1"
MenuIcon=%PAL:AppDir%\VSCode\Code.exe,0

[ContextMenu3]
Target=Directory\Background
MenuKey=VSCodePortable
MenuText=Open with Code (Portable)
MenuCommand="%PAL:LauncherPath%" "%V"
MenuIcon=%PAL:AppDir%\VSCode\Code.exe,0

[Environment]
VSCODE_HOME=%PAL:DataDir%\code

[FileWrite1]
Type=Replace
File=%PAL:DataDir%\code\User\globalStorage\storage.json
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir:DoubleBackslash%
Replace=%PAL:Drive%%PAL:PackagePartialDir:DoubleBackslash%

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\code\User\globalStorage\storage.json
Find=%PAL:LastPortableAppsBaseDir:DoubleBackslash%
Replace=%PAL:PortableAppsBaseDir:DoubleBackslash%

[FileWrite3]
Type=Replace
File=%PAL:DataDir%\code\User\settings.json
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir:DoubleBackslash%
Replace=%PAL:Drive%%PAL:PackagePartialDir:DoubleBackslash%

[FileWrite4]
Type=Replace
File=%PAL:DataDir%\code\User\settings.json
Find=%PAL:LastPortableAppsBaseDir:DoubleBackslash%
Replace=%PAL:PortableAppsBaseDir:DoubleBackslash%

[FileWrite5]
Type=Replace
File=%PAL:DataDir%\code\extensions\extensions.json
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir:DoubleBackslash%
Replace=%PAL:Drive%%PAL:PackagePartialDir:DoubleBackslash%

[FileWrite6]
Type=Replace
File=%PAL:DataDir%\code\extensions\extensions.json
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir:Forwardslash%
Replace=%PAL:Drive%%PAL:PackagePartialDir:Forwardslash%

[FilesMove]
;settings\Node.js\.npmrc=%UserProfile%
;settings\Flutter\.flutter*=%AppData%
;settings\Dart\.dart\dartdev.json=%AppData%\.dart
;settings\Dart\.dart-tool\dart-flutter-telemetry.config=%AppData%\.dart-tool

[DirectoriesMove]
-=%APPDATA%\Code
-=%USERPROFILE%\.vscode\extensions
-=%USERPROFILE%\.vscode

[DirectoriesCleanupForce]
1=%PAL:DataDir%\Temp

[DirectoriesCleanupIfEmpty]
1=%AppData%\Visual Studio Code\logs
2=%AppData%\Visual Studio Code
3=%AppData%\Code\Dictionaries
4=%AppData%\Code
5=%UserProfile%\.vscode\cli
6=%UserProfile%\.vscode
